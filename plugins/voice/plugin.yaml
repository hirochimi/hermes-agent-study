manifest_version: 1
id: voice-pipeline
name: Voice Pipeline
version: "0.1.0"
description: "Voice frontend for Hermes Agent (STT, TTS, Wake Word, Transport)"
author: "Hermes Agent Study"
license: "MIT"
homepage: "https://github.com/nousresearch/hermes-agent"

# Plugin entry point - must have register(ctx) function
entry_point: "plugins.voice"

# Required Hermes Agent version
requires_hermes: ">=0.1.0"

# Configuration schema for user config.yaml
config_schema:
  voice:
    auto_start:
      type: boolean
      default: true
      description: "Auto-start voice pipeline on session start"
    config_path:
      type: string
      default: ""
      description: "Path to voice.yaml config file (empty = default)"

# Hooks this plugin subscribes to
hooks:
  - on_session_start
  - on_session_end

# Tools this plugin provides
tools:
  - voice_start
  - voice_stop
  - voice_status

# Dependencies (pip packages)
dependencies:
  - pyyaml>=6.0
  - numpy>=1.24
  - sounddevice>=0.4.6

# Optional dependencies per engine
optional_dependencies:
  faster-whisper:
    - faster-whisper>=1.0
    - ctranslate2>=4.0
  whisper.cpp:
    - whisper-cpp-python>=0.1
  vosk:
    - vosk>=0.3.45
  piper:
    - piper-tts>=1.2
    - onnxruntime>=1.16
  coqui:
    - TTS>=0.22
  openwakeword:
    - openwakeword>=0.3
    - onnxruntime>=1.16
  porcupine:
    - pvporcupine>=3.0
  websocket:
    - websockets>=12.0
    - aiohttp>=3.9
  grpc:
    - grpcio>=1.60
    - grpcio-tools>=1.60

# Platform compatibility
platforms:
  - linux
  - linux-aarch64
  - windows
  - macos
  - macos-aarch64

# Tags for discovery
tags:
  - voice
  - stt
  - tts
  - wakeword
  - audio
  - assistant